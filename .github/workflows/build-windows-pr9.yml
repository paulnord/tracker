name: Build Windows Tracker PR9

on:
  push:
    branches: [windows-pr9-build]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out Tracker integration branch
        uses: actions/checkout@v4

      - name: Check out OSP PR9 branch
        uses: actions/checkout@v4
        with:
          repository: paulnord/osp
          ref: improve-curve-fit-reports
          path: osp-pr9

      - name: Set up Java 17 build tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Tracker 6.3.5 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build | Out-Null
          $installer = Join-Path $PWD 'build/Tracker-6.3.5-windows-x64-installer.exe'
          $url = 'https://www.compadre.org/osp/images/tracker/Tracker-6.3.5-windows-x64-installer.exe'
          & curl.exe -L --fail --retry 4 --retry-delay 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $p = Start-Process -FilePath $installer -ArgumentList '--mode','unattended','--unattendedmodeui','none' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Tracker installer exited with code $($p.ExitCode)" }

          $trackerHome = Join-Path $env:ProgramFiles 'Tracker'
          if (-not (Test-Path $trackerHome)) {
            $trackerHome = Get-ChildItem $env:ProgramFiles -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'Tracker.exe') } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $trackerHome -or -not (Test-Path $trackerHome)) { throw 'Could not locate installed Tracker directory' }

          $trackerJar = Get-ChildItem $trackerHome -Filter 'tracker.jar' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $trackerExe = Get-ChildItem $trackerHome -Filter 'Tracker.exe' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $trackerJar) { throw 'Could not locate tracker.jar in official installation' }
          if (-not $trackerExe) { throw 'Could not locate Tracker.exe in official installation' }

          "TRACKER_HOME=$trackerHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACKER_JAR=$trackerJar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACKER_EXE=$trackerExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tracker home: $trackerHome"
          Write-Host "Tracker jar:  $trackerJar"
          Write-Host "Tracker exe:  $trackerExe"
          Get-ChildItem $trackerHome -Depth 2 | Select-Object FullName, Length

      - name: Compile and overlay OSP PR9 and Tracker PR74
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/classes | Out-Null

          $jarFiles = Get-ChildItem $env:TRACKER_HOME -Filter '*.jar' -File -Recurse | Select-Object -ExpandProperty FullName
          $cp = ($jarFiles -join ';')
          if (-not $cp) { throw 'No jars found in official Tracker installation' }

          $sources = @(
            'osp-pr9/src/org/opensourcephysics/display/DataTable.java',
            'osp-pr9/src/org/opensourcephysics/display/ExportText.java',
            'osp-pr9/src/org/opensourcephysics/tools/CurveFitReport.java',
            'osp-pr9/src/org/opensourcephysics/tools/DataToolTab.java',
            'osp-pr9/src/org/opensourcephysics/tools/DataToolTable.java',
            'osp-pr9/src/org/opensourcephysics/tools/DatasetCurveFitter.java',
            'osp-pr9/src/org/opensourcephysics/tools/FitMetadataProvider.java',
            'osp-pr9/src/org/opensourcephysics/tools/FitUncertainty.java',
            'src/org/opensourcephysics/cabrillo/tracker/FitDataMetadata.java',
            'src/org/opensourcephysics/cabrillo/tracker/TableTrackView.java',
            'src/org/opensourcephysics/cabrillo/tracker/TrackPlottingPanel.java',
            'src/org/opensourcephysics/cabrillo/tracker/TrackerPanel.java'
          )

          & javac -encoding UTF-8 -cp $cp -d build/classes $sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $resourceDir = 'build/classes/org/opensourcephysics/resources/tools'
          New-Item -ItemType Directory -Force $resourceDir | Out-Null
          Copy-Item 'osp-pr9/src/org/opensourcephysics/resources/tools/tools.properties' "$resourceDir/tools.properties"

          $signatureEntries = & jar tf $env:TRACKER_JAR | Select-String -Pattern '^META-INF/.*\.(SF|RSA|DSA)$'
          if ($signatureEntries) { throw "tracker.jar is signed; refusing to invalidate signatures: $signatureEntries" }

          Copy-Item $env:TRACKER_JAR "$env:TRACKER_JAR.before-pr9" -Force
          & jar --update --file $env:TRACKER_JAR -C build/classes .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & javap -classpath $env:TRACKER_JAR org.opensourcephysics.tools.CurveFitReport | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & javap -classpath $env:TRACKER_JAR org.opensourcephysics.tools.FitMetadataProvider | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & javap -classpath $env:TRACKER_JAR org.opensourcephysics.cabrillo.tracker.FitDataMetadata | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Remove-Item "$env:TRACKER_JAR.before-pr9" -Force

      - name: Assemble portable Windows test build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/package | Out-Null
          $dest = Join-Path $PWD 'build/package/Tracker-PR9'
          Copy-Item $env:TRACKER_HOME $dest -Recurse -Force

          $ospSha = (& git -C osp-pr9 rev-parse HEAD).Trim()
          $trackerSha = (& git rev-parse HEAD).Trim()
          @"
          Tracker PR9 Windows test build

          This is the official Tracker 6.3.5 Windows runtime with its bundled Java VM,
          Xuggle video engine, launcher and support files. Its tracker.jar has been
          overlaid with the current OSP PR #9 curve-fit changes and Tracker PR #74
          fit-metadata adapter changes.

          Tracker packaging branch commit: $trackerSha
          OSP PR9 branch commit: $ospSha

          Launch: Tracker.exe

          This is a development/test build, not an official Open Source Physics release.
          The native Tracker.exe comes from the official 6.3.5 Windows distribution;
          the Java application jar inside this directory contains the experimental changes.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dest 'README-PR9.txt')

          if (-not (Get-ChildItem $dest -Filter 'Tracker.exe' -File -Recurse)) { throw 'Portable package is missing Tracker.exe' }
          Compress-Archive -Path $dest -DestinationPath 'build/Tracker-PR9-Windows-x64.zip' -Force

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-PR9-Windows-x64
          path: build/Tracker-PR9-Windows-x64.zip
          if-no-files-found: error
